<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Campus Tasks｜課業任務管理</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5ef;color:#243b31;font-family:system-ui,sans-serif}main{max-width:760px;margin:64px auto;padding:0 24px}.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#617469}.tag{border:1px solid #cbd5c9;border-radius:30px;padding:7px 12px}h1{font-size:clamp(34px,6vw,52px);letter-spacing:-2px;margin:40px 0 12px}p{color:#617469;line-height:1.7}.card{margin-top:30px;background:white;border:1px solid #dce2d7;border-radius:20px;padding:28px;box-shadow:0 12px 40px #253c3008}form{display:flex;gap:10px}input[type=text]{min-width:0;flex:1;border:1px solid #cad4c8;border-radius:10px;padding:14px;font:inherit}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 17px;background:#284d3b;color:white}button:disabled{opacity:.5}ul{list-style:none;padding:0;margin:20px 0 0}li{display:flex;align-items:center;gap:12px;padding:17px 0;border-top:1px solid #edf0e9}li span{flex:1;overflow-wrap:anywhere}input[type=checkbox]{width:20px;height:20px;accent-color:#284d3b}.done{text-decoration:line-through;color:#849086}.delete{background:#f7eeea;color:#965d48;font-size:13px}#error{color:#ae382a}#empty{padding:26px 0;text-align:center}footer{margin-top:30px;color:#738074;font-size:12px;line-height:1.8}@media(max-width:500px){main{margin-top:30px}.card{padding:18px}form{flex-wrap:wrap}form button{width:100%}}
</style></head><body><main><div class="top"><b>CAMPUS / TASKS</b><span class="tag">HW7 · Software Engineering</span></div><h1>一步一步，完成目標。</h1><p>把課業整理好，留一點時間給自己。<br>新增任務、記錄進度，讓每一次完成都看得見。</p><section class="card"><form id="form"><input id="title" type="text" aria-label="任務名稱" placeholder="接下來想完成什麼？" maxlength="100" required><button type="submit">新增任務 ＋</button></form><p id="error" role="alert"></p><p id="summary" aria-live="polite"></p><ul id="tasks"></ul><p id="empty">目前沒有任務，新增第一個目標吧！</p></section><footer>111210552 林小蓮 · 資工四<br>Node.js Web API / Unit Tests / API Tests / Playwright E2E<br>示範系統：資料暫存於伺服器記憶體，重新啟動後清空。</footer></main>
<script type="module">
const list=document.querySelector('#tasks'), error=document.querySelector('#error'), input=document.querySelector('#title');
async function api(path='', options={}) {const r=await fetch('/api/tasks'+path,{...options,headers:{'Content-Type':'application/json'}}); const data=await r.json();if(!r.ok)throw new Error(data.error);return data;}
async function render(){const tasks=await api();list.replaceChildren();document.querySelector('#empty').hidden=tasks.length>0;document.querySelector('#summary').textContent=`已完成 ${tasks.filter(t=>t.completed).length} / ${tasks.length} 項任務`;for(const task of tasks){const row=document.createElement('li'),check=document.createElement('input'),label=document.createElement('span'),del=document.createElement('button');check.type='checkbox';check.checked=task.completed;check.setAttribute('aria-label','完成 '+task.title);label.textContent=task.title;label.className=task.completed?'done':'';del.textContent='刪除';del.className='delete';del.setAttribute('aria-label','刪除 '+task.title);check.onchange=()=>act(()=>api('/'+task.id,{method:'PATCH',body:JSON.stringify({completed:check.checked})}));del.onclick=()=>act(()=>api('/'+task.id,{method:'DELETE'}));row.append(check,label,del);list.append(row);}}
async function act(fn){try{error.textContent='';await fn();await render();}catch(e){error.textContent=e.message;}}
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();await act(async()=>{await api('',{method:'POST',body:JSON.stringify({title:input.value})});input.value='';input.focus();});};
act(async()=>{});
</script></body></html>
